<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
</head>
<style>
    body {
        text-align: center;
    }
    #formBtn {
        color: white;
        background-color: cornflowerblue;
        border: none;
        border-radius: 2px;
        padding: 0.25rem 1rem;
        margin-top: 1rem;
        cursor: pointer;
        font-size: 1rem;
    }
    form {
        border: 2px solid grey;
        display: inline-block;
        padding: 2rem;
        border-radius: 0.5rem;
        text-align: left;
    }
    .field {
        margin-bottom: 0.5rem;
    }
</style>
<body>
    <h1>Welcome to our app!</h1>
    <form action="/addUser" method="POST" target="_blank" id="signupForm">
        <div class="field">
            <label for="email">Email: </label>
            <input type="text" name="email" placeholder="sukuna@gmail.com">
        </div>
        <div class="field">
            <label for="username">Username: </label>
            <input type="text" name="username" placeholder="Ryomen Sukuna">
        </div>
        <div class="field">
            <label for="password">Email: </label>
            <input type="password" name="password" placeholder="password">
        </div>

        <button id="formBtn">Sign up</button>
    </form>

    <script>
        function resetForm() {
            let myForm = document.getElementById("signupForm");
            myForm.reset();
            return false;
        }
    </script>
</body>
</html>
